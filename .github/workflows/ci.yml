name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  analyze-and-test:
    # The suite exercises the Windows DPAPI bindings natively and the app
    # targets Windows/Android, so the Windows runner is the truthful one.
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
